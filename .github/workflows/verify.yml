name: TeraClaw verify action

# Reusable Level 2 runner. The caller repo supplies the tested SHA, base ref,
# numeric repository id, pinned runner URL/hash, and a dashboard `license:ci`
# key. The action exchanges that key for a short-lived signed v2 CI license on
# every run, then verifies it offline in the runner.
#
# The OIDC certificate's job_workflow_ref is this repo at the pinned tag, and
# job_workflow_sha is this workflow commit. Receipt verification pins both, the
# numeric repository id, and the tested commit.

on:
  workflow_call:
    inputs:
      head_sha:
        required: true
        type: string
      base_ref:
        required: true
        type: string
      base_sha:
        required: false
        type: string
        default: ""
      scope:
        required: true
        type: string
      repository_id:
        required: true
        type: number
      runner_sha256:
        required: true
        type: string
      runner_arch:
        required: false
        type: string
        default: x86_64
      runner_download_host:
        required: true
        type: string
      runner_source_commit:
        required: true
        type: string
      runner_signer_workflow:
        required: true
        type: string
      runner_source_repository_id:
        required: true
        type: number
      runner_source_repository:
        required: false
        type: string
        default: "quantumlabssh/teraclaw"
      workflow_tag:
        required: true
        type: string
    secrets:
      TERACLAW_LICENSE_CI_KEY:
        required: true

permissions:
  contents: read
  checks: write

env:
  ACTION_REPO: quantumlabssh/teraclaw-verify-action
  TERACLAW_LICENSE_URL: https://teraclaw.org/api/license/ci

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HEAD_SHA: ${{ inputs.head_sha }}
      BASE_REF: ${{ inputs.base_ref }}
      BASE_SHA: ${{ inputs.base_sha }}
      SCOPE: ${{ inputs.scope }}
      REPOSITORY_ID: ${{ inputs.repository_id }}
      RUNNER_SHA256: ${{ inputs.runner_sha256 }}
      RUNNER_ARCH: ${{ inputs.runner_arch }}
      RUNNER_DOWNLOAD_HOST: ${{ inputs.runner_download_host }}
      RUNNER_SOURCE_COMMIT: ${{ inputs.runner_source_commit }}
      RUNNER_SIGNER_WORKFLOW: ${{ inputs.runner_signer_workflow }}
      RUNNER_SOURCE_REPOSITORY_ID: ${{ inputs.runner_source_repository_id }}
      RUNNER_SOURCE_REPOSITORY: ${{ inputs.runner_source_repository }}
      WORKFLOW_TAG: ${{ inputs.workflow_tag }}
      LICENSE_CI_KEY: ${{ secrets.TERACLAW_LICENSE_CI_KEY }}
    steps:
      - name: Check out the verify action
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ env.ACTION_REPO }}
          ref: ${{ env.WORKFLOW_TAG }}
          path: .teraclaw-verify-action
          persist-credentials: false

      - name: Require a CI license key
        if: env.LICENSE_CI_KEY == ''
        run: |
          echo "::error::TeraClaw CI license key is missing"
          exit 1

      - name: Exchange the CI key for a signed license
        id: license
        if: env.LICENSE_CI_KEY != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if ! printf '%s' "$RUNNER_SHA256" | grep -Eq '^[0-9a-fA-F]{64}$'; then
            echo "runner_sha256 must be 64 hex characters" >&2
            exit 1
          fi
          set +e
          http_code=$(curl -sS -o response.json -w '%{http_code}' \
            -X POST "$TERACLAW_LICENSE_URL" \
            -H "Authorization: Bearer $LICENSE_CI_KEY" \
            -H "content-type: application/json" \
            --data "{\"repository_id\": $REPOSITORY_ID, \"runner_sha256\": \"$RUNNER_SHA256\", \"arch\": \"$RUNNER_ARCH\"}")
          curl_code=$?
          set -e
          if [ "$curl_code" -ne 0 ] || [ "$http_code" -ne 200 ]; then
            echo "license exchange failed (curl=$curl_code http=$http_code)"
            cat response.json 2>/dev/null || true
            exit 1
          fi
          if ! jq -e '.license and .runner.url and .runner.bundle_url' response.json >/dev/null; then
            echo "license response is incomplete" >&2
            exit 1
          fi
          runner_url=$(jq -r '.runner.url' response.json)
          bundle_url=$(jq -r '.runner.bundle_url' response.json)
          for url in "$runner_url" "$bundle_url"; do
            scheme=$(python -c 'import sys, urllib.parse; print(urllib.parse.urlparse(sys.argv[1]).scheme or "")' "$url")
            host=$(python -c 'import sys, urllib.parse; print(urllib.parse.urlparse(sys.argv[1]).hostname or "")' "$url")
            port=$(python -c 'import sys, urllib.parse; print(urllib.parse.urlparse(sys.argv[1]).port or "")' "$url")
            if [ "$scheme" != "https" ] || [ "$host" != "$RUNNER_DOWNLOAD_HOST" ] || \
               { [ -n "$port" ] && [ "$port" != "443" ]; }; then
              echo "runner URL $url is not HTTPS on pinned host $RUNNER_DOWNLOAD_HOST" >&2
              exit 1
            fi
          done
          jq -r '.license' response.json > license.json
          echo "runner_url=$runner_url" >> "$GITHUB_OUTPUT"
          echo "bundle_url=$bundle_url" >> "$GITHUB_OUTPUT"

      - name: Check out the code under test
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          path: repo
          persist-credentials: false

      - name: Download, hash-check, and verify the runner
        env:
          RUNNER_URL: ${{ steps.license.outputs.runner_url }}
          RUNNER_BUNDLE_URL: ${{ steps.license.outputs.bundle_url }}
        run: |
          curl --proto '=https' --tlsv1.2 --max-redirs 0 -fsSL "$RUNNER_URL" -o runner.tar.gz
          echo "$RUNNER_SHA256  runner.tar.gz" | sha256sum -c -
          curl --proto '=https' --tlsv1.2 --max-redirs 0 -fsSL "$RUNNER_BUNDLE_URL" -o runner.sigstore.json
          python -m pip install --quiet 'sigstore==4.5.1'
          python .teraclaw-verify-action/verify_runner_bundle.py \
            --file runner.tar.gz \
            --bundle runner.sigstore.json \
            --expected-sha256 "$RUNNER_SHA256" \
            --signer-workflow "$RUNNER_SIGNER_WORKFLOW" \
            --source-commit "$RUNNER_SOURCE_COMMIT" \
            --source-repository-id "$RUNNER_SOURCE_REPOSITORY_ID" \
            --source-repository "$RUNNER_SOURCE_REPOSITORY"
          mkdir runner
          tar -xzf runner.tar.gz -C runner

      - name: Run the verifier
        id: verify
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TERACLAW_DATA_DIR: ${{ github.workspace }}/.teraclaw-run
          TERACLAW_INSTANCE_KEY_PATH: ${{ github.workspace }}/.teraclaw-run/instance_key
        run: |
          set +e
          ./runner/teraclaw-verify run \
            --repo repo \
            --head-sha "$HEAD_SHA" \
            --base-ref "$BASE_REF" \
            --base-sha "$BASE_SHA" \
            --scope "$SCOPE" \
            --repository "$GITHUB_REPOSITORY" \
            --repository-id "$REPOSITORY_ID" \
            --workflow-tag "$WORKFLOW_TAG" \
            --license-file license.json \
            --check-out check.json \
            --out receipt.json
          verify_code=$?
          echo "exit_code=$verify_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload the receipt
        if: always() && steps.verify.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: teraclaw-receipt
          path: |
            receipt.json
            check.json
          if-no-files-found: ignore

      - name: Post the check run
        if: always() && steps.verify.outcome != 'skipped'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          exit_code="${{ steps.verify.outputs.exit_code }}"
          if [ -z "$exit_code" ]; then exit_code=1; fi
          if [ -f check.json ]; then
            python .teraclaw-verify-action/post_check.py --file check.json
          else
            python .teraclaw-verify-action/post_check.py \
              --head-sha "$HEAD_SHA" \
              --conclusion action_required \
              --title "TeraClaw verify" \
              --summary "TeraClaw verifier did not produce a signed receipt"
            exit_code=1
          fi
          exit "$exit_code"

      - name: Post a setup-failure check
        if: failure() && steps.verify.outcome == 'skipped'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python .teraclaw-verify-action/post_check.py \
            --head-sha "$HEAD_SHA" \
            --conclusion action_required \
            --title "TeraClaw verify" \
            --summary "TeraClaw verify setup failed (license, runner, checkout, or download)"
