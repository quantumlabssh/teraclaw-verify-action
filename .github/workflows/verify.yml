name: TeraClaw verify action

# Reusable Level 2 runner. The caller repo supplies the tested SHA, base ref,
# numeric repository id, pinned runner hash/signer identity, and a dashboard
# `license:ci` key. The action exchanges that key for a short-lived signed v2 CI
# license on every run, verifies the pinned runner, and signs a receipt.
#
# Two jobs keep the write token away from the verifier:
#   verify      - no checks:write, no GitHub token in the verifier; uploads the
#                 signed receipt as an artifact.
#   post-check  - downloads the receipt, verifies the DSSE envelope, requires the
#                 subject commit to equal the event head SHA, and derives the
#                 check conclusion from `predicate.assurance`. A workspace
#                 `check.json` is never trusted.
#
# The OIDC certificate's job_workflow_ref is this repo at the pinned tag, and
# job_workflow_sha is this workflow commit. Receipt verification pins both, the
# numeric repository id, and the tested commit.

on:
  workflow_call:
    inputs:
      head_sha:
        required: true
        type: string
      base_ref:
        required: true
        type: string
      base_sha:
        required: false
        type: string
        default: ""
      scope:
        required: true
        type: string
      repository_id:
        required: true
        type: number
      runner_sha256:
        required: true
        type: string
      runner_arch:
        required: false
        type: string
        default: x86_64
      runner_download_host:
        required: true
        type: string
      runner_source_commit:
        required: true
        type: string
      runner_signer_workflow:
        required: true
        type: string
      runner_source_repository_id:
        required: true
        type: number
      runner_source_repository:
        required: false
        type: string
        default: "quantumlabssh/teraclaw"
      workflow_tag:
        required: true
        type: string
    secrets:
      TERACLAW_LICENSE_CI_KEY:
        required: true

permissions:
  contents: read

env:
  ACTION_REPO: quantumlabssh/teraclaw-verify-action
  TERACLAW_LICENSE_URL: https://teraclaw.org/api/license/ci

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HEAD_SHA: ${{ inputs.head_sha }}
      BASE_REF: ${{ inputs.base_ref }}
      BASE_SHA: ${{ inputs.base_sha }}
      SCOPE: ${{ inputs.scope }}
      REPOSITORY_ID: ${{ inputs.repository_id }}
      RUNNER_SHA256: ${{ inputs.runner_sha256 }}
      RUNNER_ARCH: ${{ inputs.runner_arch }}
      RUNNER_DOWNLOAD_HOST: ${{ inputs.runner_download_host }}
      RUNNER_SOURCE_COMMIT: ${{ inputs.runner_source_commit }}
      RUNNER_SIGNER_WORKFLOW: ${{ inputs.runner_signer_workflow }}
      RUNNER_SOURCE_REPOSITORY_ID: ${{ inputs.runner_source_repository_id }}
      RUNNER_SOURCE_REPOSITORY: ${{ inputs.runner_source_repository }}
      WORKFLOW_TAG: ${{ inputs.workflow_tag }}
    steps:
      - name: Refuse fork pull requests
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::TeraClaw verify does not run for fork pull requests"
          exit 1

      - name: Check out the verify action
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ env.ACTION_REPO }}
          ref: ${{ env.WORKFLOW_TAG }}
          path: .teraclaw-verify-action
          persist-credentials: false

      - name: Require a CI license key
        if: env.LICENSE_CI_KEY == ''
        env:
          LICENSE_CI_KEY: ${{ secrets.TERACLAW_LICENSE_CI_KEY }}
        run: |
          echo "::error::TeraClaw CI license key is missing"
          exit 1

      - name: Exchange the CI key for a signed license
        id: license
        if: env.LICENSE_CI_KEY != ''
        env:
          LICENSE_CI_KEY: ${{ secrets.TERACLAW_LICENSE_CI_KEY }}
        run: |
          if ! printf '%s' "$RUNNER_SHA256" | grep -Eq '^[0-9a-fA-F]{64}$'; then
            echo "runner_sha256 must be 64 hex characters" >&2
            exit 1
          fi
          # The license server controls the presigned URL. Requiring the pinned
          # R2 host keeps a caller from widening it to an arbitrary origin.
          case "$RUNNER_DOWNLOAD_HOST" in
            *.r2.cloudflarestorage.com) ;;
            *)
              echo "runner_download_host must be an R2 storage host" >&2
              exit 1
              ;;
          esac
          set +e
          http_code=$(curl -sS -o response.json -w '%{http_code}' \
            -X POST "$TERACLAW_LICENSE_URL" \
            -H "Authorization: Bearer $LICENSE_CI_KEY" \
            -H "content-type: application/json" \
            --data "{\"repository_id\": $REPOSITORY_ID, \"runner_sha256\": \"$RUNNER_SHA256\", \"arch\": \"$RUNNER_ARCH\"}")
          curl_code=$?
          set -e
          if [ "$curl_code" -ne 0 ] || [ "$http_code" -ne 200 ]; then
            echo "license exchange failed (curl=$curl_code http=$http_code)"
            cat response.json 2>/dev/null || true
            exit 1
          fi
          if ! jq -e '.license and .runner.url and .runner.bundle_url' response.json >/dev/null; then
            echo "license response is incomplete" >&2
            exit 1
          fi
          runner_url=$(jq -r '.runner.url' response.json)
          bundle_url=$(jq -r '.runner.bundle_url' response.json)
          for url in "$runner_url" "$bundle_url"; do
            scheme=$(python -c 'import sys, urllib.parse; print(urllib.parse.urlparse(sys.argv[1]).scheme or "")' "$url")
            host=$(python -c 'import sys, urllib.parse; print(urllib.parse.urlparse(sys.argv[1]).hostname or "")' "$url")
            port=$(python -c 'import sys, urllib.parse; print(urllib.parse.urlparse(sys.argv[1]).port or "")' "$url")
            if [ "$scheme" != "https" ] || [ "$host" != "$RUNNER_DOWNLOAD_HOST" ] || \
               { [ -n "$port" ] && [ "$port" != "443" ]; }; then
              echo "runner URL $url is not HTTPS on pinned host $RUNNER_DOWNLOAD_HOST" >&2
              exit 1
            fi
          done
          jq -r '.license' response.json > license.json
          echo "runner_url=$runner_url" >> "$GITHUB_OUTPUT"
          echo "bundle_url=$bundle_url" >> "$GITHUB_OUTPUT"

      - name: Check out the code under test
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          path: repo
          persist-credentials: false

      - name: Download, hash-check, and verify the runner
        env:
          RUNNER_URL: ${{ steps.license.outputs.runner_url }}
          RUNNER_BUNDLE_URL: ${{ steps.license.outputs.bundle_url }}
        run: |
          curl --proto '=https' --tlsv1.2 --max-redirs 0 -fsSL "$RUNNER_URL" -o runner.tar.gz
          echo "$RUNNER_SHA256  runner.tar.gz" | sha256sum -c -
          curl --proto '=https' --tlsv1.2 --max-redirs 0 -fsSL "$RUNNER_BUNDLE_URL" -o runner.sigstore.json
          python -m pip install --quiet 'sigstore==4.5.1'
          python .teraclaw-verify-action/verify_runner_bundle.py \
            --file runner.tar.gz \
            --bundle runner.sigstore.json \
            --expected-sha256 "$RUNNER_SHA256" \
            --signer-workflow "$RUNNER_SIGNER_WORKFLOW" \
            --source-commit "$RUNNER_SOURCE_COMMIT" \
            --source-repository-id "$RUNNER_SOURCE_REPOSITORY_ID" \
            --source-repository "$RUNNER_SOURCE_REPOSITORY"
          mkdir runner
          tar -xzf runner.tar.gz -C runner

      - name: Run the verifier
        continue-on-error: true
        env:
          # No GitHub token and no license key: the verifier only needs the
          # signed license file, and tested code must not see a write token.
          TERACLAW_DATA_DIR: ${{ runner.temp }}/teraclaw-run
          TERACLAW_INSTANCE_KEY_PATH: ${{ runner.temp }}/teraclaw-run/instance_key
        run: |
          set +e
          ./runner/teraclaw-verify run \
            --repo repo \
            --head-sha "$HEAD_SHA" \
            --base-ref "$BASE_REF" \
            --base-sha "$BASE_SHA" \
            --scope "$SCOPE" \
            --repository "$GITHUB_REPOSITORY" \
            --repository-id "$REPOSITORY_ID" \
            --workflow-tag "$WORKFLOW_TAG" \
            --license-file license.json \
            --out "$RUNNER_TEMP/teraclaw-receipt/receipt.json"
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload the receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: teraclaw-receipt
          path: ${{ runner.temp }}/teraclaw-receipt/receipt.json
          if-no-files-found: ignore
          retention-days: 7

  post-check:
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
    env:
      HEAD_SHA: ${{ inputs.head_sha }}
      REPOSITORY_ID: ${{ inputs.repository_id }}
      WORKFLOW_TAG: ${{ inputs.workflow_tag }}
    steps:
      - name: Check out the verify action
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ env.ACTION_REPO }}
          ref: ${{ env.WORKFLOW_TAG }}
          path: .teraclaw-verify-action
          persist-credentials: false

      - name: Download the receipt
        if: needs.verify.result == 'success'
        # A verifier that crashed before writing a receipt leaves no artifact.
        # Let the post step run and post action_required instead of aborting.
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: teraclaw-receipt
          path: ${{ runner.temp }}/teraclaw-receipt

      - name: Post the check from the signed receipt
        if: needs.verify.result == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python .teraclaw-verify-action/post_check.py \
            --receipt "$RUNNER_TEMP/teraclaw-receipt/receipt.json" \
            --head-sha "$HEAD_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --repository-id "$REPOSITORY_ID"

      - name: Post a setup-failure check
        if: needs.verify.result != 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python .teraclaw-verify-action/post_check.py \
            --head-sha "$HEAD_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --repository-id "$REPOSITORY_ID" \
            --conclusion action_required \
            --summary "TeraClaw verify setup failed or was cancelled (license, runner, checkout, or download)"

      - name: Post a cancelled check
        if: cancelled()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python .teraclaw-verify-action/post_check.py \
            --head-sha "$HEAD_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --repository-id "$REPOSITORY_ID" \
            --conclusion action_required \
            --summary "TeraClaw verify was cancelled"
